<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>桂月水榭 · 中秋月夜微观角落</title>
<style>
:root{
  --gold:#ecc98a;
  --gold-hi:#ffe2a8;
  --gold-dim:rgba(236,201,138,.45);
  --line:rgba(236,201,138,.2);
  --ink:rgba(9,11,19,.34);
  --txt:#f3ebdb;
  --serif:"Songti SC","STSong","STZhongsong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","BiauKai",var(--serif);
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#04060b;color:var(--txt);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#stage,#stage canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#stage canvas{cursor:grab;touch-action:none;outline:none}
#stage canvas.grab{cursor:grabbing}
body.imm.idle #stage canvas{cursor:none}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
#hud>*{transition:opacity 1.1s cubic-bezier(.4,0,.2,1),transform 1.1s cubic-bezier(.4,0,.2,1),filter 1.1s}
#hud.fade>*{opacity:0!important;filter:blur(4px);pointer-events:none!important}
#hud.fade #title{transform:translateY(-12px)}
#hud.fade #panel{transform:translateY(16px)}
#hud.fade #keys{transform:translateY(12px)}

#title{position:absolute;left:clamp(18px,3.4vw,56px);top:clamp(16px,3.2vw,46px);display:flex;gap:16px;align-items:flex-start}
#title .seal{width:38px;height:38px;border:1.5px solid #b8322a;color:#d8453a;border-radius:4px;font-family:var(--kai);
  font-size:15px;line-height:15px;display:grid;place-items:center;padding:3px;letter-spacing:1px;writing-mode:vertical-rl;
  box-shadow:inset 0 0 0 2px rgba(184,50,42,.15);background:rgba(160,30,24,.08);margin-top:6px;opacity:.9}
#title h1{font-family:var(--kai);font-weight:400;font-size:clamp(26px,2.6vw,38px);letter-spacing:.32em;color:var(--gold-hi);
  text-shadow:0 0 18px rgba(255,200,120,.35),0 2px 10px rgba(0,0,0,.6)}
#title h1 span{color:var(--gold-dim);margin:0 .12em}
#title p{margin-top:8px;font-family:var(--serif);font-size:13px;letter-spacing:.34em;color:rgba(243,235,219,.62);
  text-shadow:0 1px 8px rgba(0,0,0,.7)}

#keys{position:absolute;left:clamp(18px,3.4vw,56px);bottom:clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:7px;
  font-size:12px;letter-spacing:.12em;color:rgba(243,235,219,.62);text-shadow:0 1px 6px rgba(0,0,0,.8)}
#keys div{display:flex;align-items:center;gap:8px}
kbd{font-family:var(--sans);font-size:11px;min-width:24px;height:21px;padding:0 7px;display:inline-grid;place-items:center;
  border:1px solid var(--line);border-radius:5px;color:var(--gold);background:rgba(10,12,20,.35);letter-spacing:0;
  box-shadow:0 1px 0 rgba(236,201,138,.12)}

#panel{position:absolute;right:clamp(14px,2.6vw,40px);bottom:clamp(14px,2.6vw,40px);width:262px;padding:18px 18px 14px;
  pointer-events:auto;border-radius:14px;background:linear-gradient(160deg,rgba(22,24,38,.34),rgba(8,9,16,.26));
  border:1px solid var(--line);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
  box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,230,180,.06)}
#panel h2{font-family:var(--kai);font-weight:400;font-size:15px;letter-spacing:.4em;color:var(--gold);display:flex;
  justify-content:space-between;align-items:baseline;margin-bottom:12px}
#panel h2 small{font-family:var(--sans);font-size:10px;letter-spacing:.08em;color:rgba(243,235,219,.4)}
.row{margin:10px 0 12px}
.row label{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.2em;color:rgba(243,235,219,.78);margin-bottom:7px}
.row label b{font-weight:400;color:var(--gold);letter-spacing:.04em;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--gold) 0,var(--gold) var(--p),rgba(243,235,219,.16) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5.5px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff5dc,#e7bd72 60%,#b98838);box-shadow:0 0 10px rgba(255,205,120,.6);border:none}
#btnGold{margin-top:6px;width:100%;height:34px;border-radius:9px;border:1px solid rgba(236,201,138,.35);cursor:pointer;
  font-family:var(--kai);font-size:14px;letter-spacing:.3em;color:#fff1d2;
  background:linear-gradient(90deg,rgba(140,70,20,.25),rgba(210,150,60,.28),rgba(140,70,20,.25));transition:all .35s}
#btnGold:hover{box-shadow:0 0 22px rgba(255,190,90,.35);border-color:rgba(255,215,140,.7)}
#btnGold.on{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 30px rgba(255,190,90,.6);background:linear-gradient(90deg,rgba(200,120,30,.4),rgba(255,200,90,.45),rgba(200,120,30,.4))}}
#stat{margin-top:10px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em;color:rgba(243,235,219,.36);
  font-variant-numeric:tabular-nums}

#toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-family:var(--kai);font-size:17px;letter-spacing:.42em;
  color:var(--gold-hi);text-shadow:0 0 16px rgba(255,190,100,.5),0 2px 8px #000;opacity:0;transition:opacity .8s}
#toast.show{opacity:1}

#loader{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#131a2e,#04060b 70%);
  transition:opacity 1.6s ease,visibility 1.6s}
#loader.done{opacity:0;visibility:hidden}
#loader .in{display:flex;flex-direction:column;align-items:center;gap:22px}
#loader .m{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 42% 40%,#fffaf0,#f1dfb6 55%,#c9ab76);
  box-shadow:0 0 40px 8px rgba(255,214,150,.35),0 0 120px 30px rgba(255,200,120,.12);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 56px 14px rgba(255,214,150,.45),0 0 160px 44px rgba(255,200,120,.16)}}
#loader p{font-family:var(--kai);letter-spacing:.5em;color:rgba(243,235,219,.75);font-size:15px}
#loader .bar{width:180px;height:1px;background:rgba(236,201,138,.15);overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
#loader .err{color:#e88;font-size:12px;letter-spacing:.05em;max-width:70vw;text-align:center}
@media (max-width:700px){#keys{display:none}#panel{width:220px}}
</style>
</head>
<body>
<div id="stage"></div>

<div id="loader"><div class="in"><div class="m"></div><p>月出东山 · 桂影初成</p><div class="bar"><i id="lbar"></i></div><div class="err" id="lerr"></div></div></div>

<div id="hud">
  <header id="title">
    <div class="seal">中秋</div>
    <div><h1>桂月<span>·</span>水榭</h1><p>月到中秋分外明　一池金桂一池秋</p></div>
  </header>
  <aside id="keys">
    <div><kbd>H</kbd>纯净沉浸模式</div>
    <div><kbd>F</kbd>全屏</div>
    <div><kbd>空格</kbd>嫦娥奔月 · 金波狂想</div>
    <div><kbd>双击</kbd>水中月影 · 激起金色涟漪</div>
    <div><kbd>拖拽</kbd>环视　<kbd>滚轮</kbd>缩放　<kbd>右键</kbd>平移</div>
  </aside>
  <section id="panel">
    <h2>夜色调律<small>H 隐藏</small></h2>
    <div class="row"><label>落桂密度<b id="vDen">1.00</b></label><input id="sDen" type="range" min="0" max="2.5" step="0.01" value="1"></div>
    <div class="row"><label>灯笼亮度<b id="vLan">1.00</b></label><input id="sLan" type="range" min="0" max="2" step="0.01" value="1"></div>
    <div class="row"><label>月晕范围<b id="vHalo">1.00</b></label><input id="sHalo" type="range" min="0.4" max="2" step="0.01" value="1"></div>
    <button id="btnGold">金波狂想 · 空格</button>
    <div id="stat"><span id="fps">— FPS</span><span id="pcount">落桂 0</span></div>
  </section>
  <div id="toast"></div>
</div>
<!--SCRIPTS-->
</body>
</html>
